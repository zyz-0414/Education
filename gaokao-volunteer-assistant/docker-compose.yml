services:
  postgres:
    image: postgres:16-alpine
    container_name: gaokao-volunteer-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gaokao_volunteer_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gaokao_volunteer_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
